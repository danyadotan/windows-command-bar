name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package:win
      - name: Smoke-test packaged native messaging host
        run: node scripts/native-host-smoke.cjs "release/win-unpacked/resources/native-host/WinPilotNativeHost.exe"
      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WinPilot-Windows-unsigned
          path: release/*.exe
          if-no-files-found: error
      - name: Package browser extension
        shell: pwsh
        run: Compress-Archive -Path browser-extension/* -DestinationPath WinPilot-Form-Assistant.zip
      - name: Upload browser extension
        uses: actions/upload-artifact@v4
        with:
          name: WinPilot-Browser-Extension
          path: WinPilot-Form-Assistant.zip
          if-no-files-found: error
