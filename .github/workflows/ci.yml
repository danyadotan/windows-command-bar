name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - run: npm run package:win
      - name: Smoke-test packaged native messaging host
        run: node scripts/native-host-smoke.cjs "release/win-unpacked/resources/native-host/WinPilotNativeHost.exe"
      - name: Smoke-test installation and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/WinPilot-Setup-*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          ./scripts/installer-smoke.ps1 -Installer $installers[0].FullName
      - name: Record installer integrity evidence
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release/WinPilot-Setup-*.exe)
          $evidence = foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            [ordered]@{ file = $file.Name; sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash; signatureStatus = "$($sig.Status)"; commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; channel = 'internal-test-only' }
          }
          ConvertTo-Json -InputObject @($evidence) -Depth 4 | Set-Content release/installer-evidence.json
      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WinPilot-Windows-unsigned
          path: |
            release/*.exe
            release/installer-evidence.json
          if-no-files-found: error
      - name: Package browser extension
        shell: pwsh
        run: |
          node scripts/check-extension.cjs --stage
          Compress-Archive -Path release/extension/* -DestinationPath WinPilot-Form-Assistant.zip
      - name: Upload browser extension
        uses: actions/upload-artifact@v4
        with:
          name: WinPilot-Browser-Extension
          path: WinPilot-Form-Assistant.zip
          if-no-files-found: error
